<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Listener Overlay</title>
<style>
  :root {
    --accent: #5b6ee1;
    --rec: #e5484d;
    --green: #2f9e63;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  /* Liquid Glass ピル: 光を透かす白ガラス + スペキュラハイライト */
  .pill {
    display: flex; align-items: center; gap: 9px;
    width: 296px; height: 48px;
    padding: 0 9px 0 14px;
    -webkit-app-region: drag;   /* ピル全体をドラッグで移動可能に */
    cursor: grab;
    background: #262626;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    /* 外向きの影は付けない。Windows の透過ウィンドウでは影がウィンドウの
       矩形いっぱいに落ち、ピルの外側にうっすら灰色の四角が見える（実機で発生）。
       浮きは内側のハイライトと縁のコントラストだけで出す。 */
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    /* backdrop-filter も使わない。透過ウィンドウでは背後の合成結果が
       矩形に出ることがある。地の色を十分濃くして代わりにする。 */
    color: #f2f2f2;
    opacity: 0; transform: translateY(10px) scale(.97);
    transition: opacity .18s ease, transform .22s cubic-bezier(.2, .9, .3, 1.2);
  }
  .pill.visible { opacity: 1; transform: none; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  .pill.paused .dot { animation: none !important; background: rgba(255,255,255,.35); }
  .pill[data-phase="recording"] .dot { animation: pulse 1.4s ease-in-out infinite; }
  .pill[data-phase="processing"] .dot {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.18); border-top-color: var(--accent);   /* 暗色地に合わせる */
    animation: spin .8s linear infinite;
  }
  .pill[data-phase="done"] .dot { background: var(--green); }
  .pill[data-phase="error"] .dot { background: var(--rec); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(91, 110, 225, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(91, 110, 225, 0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .pill, .pill .dot { animation: none !important; transition: none !important; }
  }

  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  canvas#wave { width: 100%; height: 18px; display: block; }
  .status {
    font-size: 11px; color: rgba(255, 255, 255, 0.62);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pill[data-phase="done"] .status { color: var(--green); }
  .pill[data-phase="error"] .status { color: var(--rec); }

  .timer {
    flex: none; font-size: 12px; font-variant-numeric: tabular-nums;
    color: #f2f2f2; letter-spacing: .03em; min-width: 36px; text-align: right;
  }
  .pill[data-phase="done"] .timer { color: var(--green); font-size: 12px; }

  .btns { display: none; gap: 7px; flex: none; }
  .pill[data-phase="recording"] .btns { display: flex; }
  .pbtn {
    -webkit-app-region: no-drag;
    width: 27px; height: 27px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; padding: 0;
    transition: transform .08s ease, background .12s ease, filter .12s ease;
  }
  .pbtn:active { transform: scale(.92); }
  /* 一時停止: 落ち着いたグレーの丸。押しても記録は失われないので目立たせない */
  .pbtn.pause { background: rgba(255, 255, 255, 0.13); color: #f2f2f2; }
  .pbtn.pause:hover { background: rgba(255, 255, 255, 0.22); }
  /* 停止: 赤い四角。ここで記録が締まるので、唯一の強い色にする */
  .pbtn.stop { background: rgba(255, 255, 255, 0.13); }
  .pbtn.stop:hover { background: rgba(255, 255, 255, 0.22); }
  .pbtn .sq { width: 11px; height: 11px; border-radius: 2.5px; background: var(--rec); display: block; }
  .pbtn .bar { width: 3.5px; height: 12px; border-radius: 1.5px; background: currentColor; display: block; }
  .pbtn .tri { width: 0; height: 0; display: block;
    border-left: 10px solid currentColor; border-top: 6px solid transparent;
    border-bottom: 6px solid transparent; margin-left: 2px; }
  .pause-ico { display: flex; gap: 3px; }
  .pill.paused .pause-ico { display: none; }
  .resume-ico { display: none; }
  .pill.paused .resume-ico { display: block; }
  /* 音声入力（1本録り）は一時停止しない。短い発話が前提で、
     区間の概念も無いため、止める＝確定でよい */
  .pill:not(.meeting) .pbtn.pause { display: none; }
  /* 破棄は音声入力だけ。議事録は誤操作で会議が消えるので画面には出さない
     （破棄はメイン画面の「破棄」ボタンから、確認つきで行う） */
  .pbtn.ng { background: rgba(255, 255, 255, 0.13); color: rgba(255,255,255,.72); font-size: 11px; }
  .pbtn.ng:hover { background: rgba(255, 255, 255, 0.22); color: #fff; }
  .pill.meeting .pbtn.ng { display: none; }
</style>
</head>
<body>
  <div class="pill" id="pill" data-phase="recording">
    <div class="dot"></div>
    <div class="center">
      <canvas id="wave" width="160" height="18"></canvas>
      <div class="status" id="status">聞き取り中…</div>
    </div>
    <div class="timer" id="timer">0:00</div>
    <div class="btns">
      <button class="pbtn pause" id="pauseBtn" title="一時停止 / 再開">
        <span class="pause-ico"><span class="bar"></span><span class="bar"></span></span>
        <span class="tri resume-ico"></span>
      </button>
      <button class="pbtn stop" id="stopBtn" title="停止して議事録を作成"><span class="sq"></span></button>
      <button class="pbtn ng" id="ngBtn" title="キャンセル（Esc）">✕</button>
    </div>
  </div>

<script>
(() => {
  const DICTATION_MAX_MS = 10 * 60 * 1000;

  const pill = document.getElementById('pill');
  const statusEl = document.getElementById('status');
  const timerEl = document.getElementById('timer');
  const canvas = document.getElementById('wave');
  const ctx2d = canvas.getContext('2d');

  let mode = 'dictation'; // 'dictation' | 'meeting'
  let segmentMs = 75000;
  let segDeadline = 0;   // この時刻を過ぎたら区間を切る（setTimeout の保険）
  let paused = false;     // 一時停止中（録音は止まるが、記録は捨てない）
  let pausedAt = 0;       // 一時停止した時刻
  let pausedMs = 0;       // 一時停止していた合計。経過時間の表示から差し引く
  const FIRST_SEG_MS = 20000; // 最初のセグメントは短くして早く結果を見せる
  let firstSegDone = false;
  // mediaStream は MediaRecorder に渡すもの。相手の声を混ぜているときは
  // 合成後のストリームになるので、マイクの解放は micStream で行う。
  // ここを一本にまとめると、録音終了後もマイクが開きっぱなしになる。
  let mediaStream = null;
  let micStream = null;    // getUserMedia の生ストリーム（マイクの解放責任）
  let sysStream = null;    // getDisplayMedia の生ストリーム（相手の声）
  let mixDest = null;
  let sysAnalyser = null;
  let sysGain = null;      // 開始ビープを録らないよう、鳴らす瞬間だけ閉じる
  // 二重起動よけ。表示の状態（pill.dataset.phase）で判定してはいけない。
  // マークアップの初期値が data-phase="recording" なので、起動後の1回目が
  // 必ず弾かれる。表示は表示、録っているかは録っているかで持つ。
  let starting = false;    // start() の中で、まだ録り始めていない
  let active = false;      // 録音中（stop / cancel / 変換完了で倒す）
  let sysWanted = false;   // 設定でオンになっているか
  let sysOn = false;       // 実際に取り込めたか
  let recorder = null;
  let chunks = [];
  let cancelled = false;
  let stopping = false;
  let startedAt = 0;   // セッション開始（表示用）
  let segStart = 0;    // セグメント開始
  let timerId = null;
  let autoStopId = null;
  let audioCtx = null;
  let analyser = null;
  let rafId = null;
  let micId = '';
  let soundOn = true;

  // ---------------- 効果音 ----------------
  let sctx = null;
  function beep(seq) {
    if (!soundOn) return;
    try {
      if (!sctx) sctx = new AudioContext();
      sctx.resume().catch(() => {});
      const t0 = sctx.currentTime + 0.01;
      for (const [f, d, off] of seq) {
        const o = sctx.createOscillator();
        const g = sctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + off);
        g.gain.exponentialRampToValueAtTime(0.07, t0 + off + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + d);
        o.connect(g).connect(sctx.destination);
        o.start(t0 + off);
        o.stop(t0 + off + d + 0.03);
      }
    } catch (_) { /* noop */ }
  }
  const SND = {
    start: [[620, 0.09, 0], [880, 0.12, 0.07]],
    stop: [[880, 0.07, 0], [660, 0.1, 0.06]],
    done: [[1040, 0.12, 0]],
    cancel: [[440, 0.09, 0]],
    error: [[220, 0.22, 0]],
  };

  // ---------------- WAV変換（16kHz mono PCM16） ----------------
  async function blobToWav16k(blob) {
    const arr = await blob.arrayBuffer();
    const dc = new AudioContext();
    let decoded;
    try {
      decoded = await dc.decodeAudioData(arr);
    } finally {
      dc.close().catch(() => {});
    }
    const rate = 16000;
    const len = Math.max(1, Math.ceil(decoded.duration * rate));
    const oac = new OfflineAudioContext(1, len, rate);
    const src = oac.createBufferSource();
    src.buffer = decoded;
    src.connect(oac.destination);
    src.start();
    const rendered = await oac.startRendering();
    const f32 = rendered.getChannelData(0);
    const out = new ArrayBuffer(44 + f32.length * 2);
    const dv = new DataView(out);
    const wstr = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
    wstr(0, 'RIFF');
    dv.setUint32(4, 36 + f32.length * 2, true);
    wstr(8, 'WAVE');
    wstr(12, 'fmt ');
    dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true);
    dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true);
    dv.setUint32(28, rate * 2, true);
    dv.setUint16(32, 2, true);
    dv.setUint16(34, 16, true);
    wstr(36, 'data');
    dv.setUint32(40, f32.length * 2, true);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      dv.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Uint8Array(out);
  }

  // ---------------- 表示 ----------------
  // ピルは狭い（議事録の録音中で全角15文字ほど）。録音中の文言はここに集約する。
  // 無音警告から戻るときも同じ関数を使うので、警告が一度出ただけで
  // 「相手の声も」の表示が消えることがない。
  function recordingLabel() {
    if (paused) return '一時停止中';
    if (mode !== 'meeting') return '聞き取り中…';
    if (!sysWanted) return '議事録を記録中';
    return sysOn ? '記録中（相手の声も）' : '記録中（マイクのみ）';
  }
  function setPhase(phase, message) {
    pill.dataset.phase = phase;
    if (message != null) statusEl.textContent = message;
  }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
      : `${m}:${String(sec).padStart(2, '0')}`;
  }
  let ampHist = [];
  // 無音の続いた時間。マイクが塞がれていると、エラーも出ないまま
  // 無音のまま録り続けてしまい、文字起こしが空になるまで気づけない。
  let silentSince = 0;
  const SILENT_WARN_MS = 8000;
  const SILENT_LEVEL = 0.02;
  // 相手の声も録っているとき、マイクだけが死んでいると
  // 両側の合計では音が入っているので上の見張りに引っかからない。
  // 自分の発言だけが会議まるごと欠けるので、別に数える。
  // 聞き役に回っているだけのときに警告しないよう、こちらは長めにとる。
  let micSilentSince = 0;
  const MIC_SILENT_WARN_MS = 60000;
  // いま出している文言。二つの見張りがフラグを取り合うと、
  // 相手が喋っている間じゅう警告と通常表示が毎フレーム入れ替わって読めなくなる。
  // 「出すべき文言」を毎フレーム決め、変わったときだけ書き換える。
  let shownLabel = '';
  function showRecording(label) {
    shownLabel = label;
    setPhase('recording', label);
  }
  // 声の大きさ（RMS）。マイクと相手の声で同じ計算を使う。
  function rmsOf(node) {
    const data = new Uint8Array(node.fftSize);
    node.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sum += v * v;
    }
    return Math.min(1, Math.sqrt(sum / data.length) * 3.4);
  }
  function drawWave() {
    const w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0, 0, w, h);
    if (!analyser) return;
    // 毎フレーム記録し、右から左へ流れるバーで描く
    const micLevel = rmsOf(analyser);
    const sysLevel = sysAnalyser ? rmsOf(sysAnalyser) : 0;
    const level = Math.max(micLevel, sysLevel);
    checkSilence(micLevel, sysLevel);
    ampHist.push(level);
    const bars = 40;
    if (ampHist.length > bars) ampHist.shift();
    const bw = w / bars;
    // ピルは暗色なので波形も明るくする。ここを地の色のまま暗くしておくと、
    // 暗い背景に暗い波形で何も見えない（実機で発生）。
    ctx2d.fillStyle = paused ? 'rgba(255,255,255,0.32)' : 'rgba(255,255,255,0.86)';
    for (let i = 0; i < ampHist.length; i++) {
      const x = w - (ampHist.length - i) * bw;   // 右端が最新
      const bh = Math.max(2, ampHist[i] * (h - 2));
      const y = (h - bh) / 2;                     // 上下中央
      if (ctx2d.roundRect) {
        ctx2d.beginPath();
        ctx2d.roundRect(x + 1, y, bw - 2, bh, (bw - 2) / 2);
        ctx2d.fill();
      } else {
        ctx2d.fillRect(x + 1, y, bw - 2, bh);
      }
    }
    rafId = requestAnimationFrame(drawWave);
  }
  function pickMime() {
    const cands = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    for (const m of cands) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  }

  // ---------------- 録音本体 ----------------
  // 相手の声（パソコンから出ている音）。仕様上、映像を要求しないと必ず失敗するので
  // 映像も要求し、受け取った瞬間に捨てる。捨てないと画面キャプチャが走り続ける。
  async function openSystemStream() {
    const s = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      // ループバック側に自動ゲイン・ノイズ抑制・エコー除去がかかると、
      // 会議相手の声がそのまま劣化する。明示的に切る。
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    for (const t of s.getVideoTracks()) { s.removeTrack(t); t.stop(); }
    if (s.getAudioTracks().length === 0) {
      s.getTracks().forEach((t) => t.stop());
      throw new Error('音声トラックが返らなかった');
    }
    return s;
  }

  async function openStream() {
    // 相手の声を先に取る。ユーザー操作とみなされる有効時間が短いため、
    // マイクのデバイスオープンを待ってからでは間に合わないことがある。
    sysStream = null; sysOn = false;
    if (sysWanted) {
      try { sysStream = await openSystemStream(); sysOn = true; }
      catch (e) { sysStream = null; sysOn = false; }
    }

    const audio = {
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    };
    if (micId) audio.deviceId = { ideal: micId };
    // マイクは必須。ここが失敗したら start() が握って中止する。
    micStream = await navigator.mediaDevices.getUserMedia({ audio });

    audioCtx = new AudioContext();
    audioCtx.resume().catch(() => {});
    const micSrc = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    micSrc.connect(analyser);

    if (sysStream) {
      // [マイク] ─┬→ analyser（マイクのレベル）
      //           └→ micGain ─┐
      // [相手の声] → sysGain ──┼→ mixBus(1ch) → mixDest → MediaRecorder
      //                        └→ sysAnalyser（相手のレベル）
      const micGain = audioCtx.createGain(); micGain.gain.value = 1.0;
      sysGain = audioCtx.createGain(); sysGain.gain.value = 1.0;

      // ここでモノラルに確定させる。explicit + 1ch にすると「足す前に」
      // 各入力がモノラルへ落ちるので、相手の声が 2ch でも取りこぼさない。
      const mixBus = audioCtx.createGain();
      mixBus.channelCount = 1;
      mixBus.channelCountMode = 'explicit';
      mixBus.gain.value = 0.9;              // 2本足しのヘッドルーム

      mixDest = audioCtx.createMediaStreamDestination();
      try {
        mixDest.channelCount = 1;
        mixDest.channelCountMode = 'explicit';
      } catch (_) { /* 実装差。下流の blobToWav16k が 1ch に落とすので致命ではない */ }

      const sysSrc = audioCtx.createMediaStreamSource(sysStream);
      sysAnalyser = audioCtx.createAnalyser();
      sysAnalyser.fftSize = 512;
      sysAnalyser.smoothingTimeConstant = 0.6;

      micSrc.connect(micGain).connect(mixBus);
      sysSrc.connect(sysGain).connect(mixBus);
      sysGain.connect(sysAnalyser);

      // 開始のビープはスピーカーへ出る＝ループバックにも乗る。
      // 閉じるのはビープを鳴らす瞬間（start 側の muteSystemForBeep）。
      // ここで閉じてしまうと、下のチャンネル数待ちの分だけ先に明けてしまう。

      mixBus.connect(mixDest);

      // 途中で取り込みが切れてもマイクだけで録り続ける。
      // 録音対象は mixDest.stream で固定なので、MediaRecorder は影響を受けない。
      const st = sysStream.getAudioTracks()[0];
      st.addEventListener('ended', () => {
        if (!sysOn) return;                  // releaseStream の stop() では発火しないが念のため
        sysAnalyser = null; sysOn = false;
        sysGain = null;
        // 報告し直さないと、以後マイクしか録れていないのに
        // ピルもアプリのバーも「相手の声も」と言い続ける。
        window.koeOverlay.reportSource(false, true);
        // 次のフレームで checkSilence が出すべき文言を決め直す
        shownLabel = '';
      });

      mediaStream = mixDest.stream;
      // Chromium は音が1量子流れるまで、この出力を 2ch と名乗り続けることがある。
      // その状態で MediaRecorder を作るとステレオで確定し、32kbps を左右で
      // 分け合ってしまう。最大 200ms だけ待つ（分からない実装では待たない）。
      const track = mediaStream.getAudioTracks()[0];
      for (let i = 0; i < 20; i++) {
        const ch = track.getSettings ? track.getSettings().channelCount : 1;
        if (typeof ch !== 'number' || ch === 1) break;
        await new Promise((r) => setTimeout(r, 10));
      }
    } else {
      mediaStream = micStream;   // 従来どおりの1本録り
    }

    // 待っている間に「終了」「破棄」が押されていることがある。
    // ここで表示を 'recording' に戻すと、押した後なのに録音中に見えるうえ、
    // 二度と録音を始められなくなる（表示の状態を起動条件に使っていた頃の名残）。
    if (cancelled || stopping) return;
    if (sysWanted) window.koeOverlay.reportSource(sysOn, true);
    showRecording(recordingLabel());
    drawWave();
  }

  // 開始・停止のビープが相手の声として録音に混ざらないよう、鳴らす前後だけ閉じる
  function muteSystemForBeep() {
    if (!sysGain || !audioCtx) return;
    const t = audioCtx.currentTime;
    sysGain.gain.setValueAtTime(0, t);
    sysGain.gain.setValueAtTime(1.0, t + 0.3);
  }

  function newRecorder() {
    const mime = pickMime();
    const rec = new MediaRecorder(
      mediaStream,
      mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 },
    );
    rec.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
      cutSegmentIfOverdue(rec);
    };
    return rec;
  }

  async function start() {
    cleanup();            // 立っていれば starting もここで倒れる
    starting = true;      // openStream を待っている間の二重起動を止める
    cancelled = false;
    stopping = false;
    chunks = [];
    segDeadline = 0;
    ampHist = [];
    silentSince = 0;
    micSilentSince = 0;
    paused = false; pausedAt = 0; pausedMs = 0;
    pill.classList.remove('paused');
    shownLabel = '';
    firstSegDone = false;
    showRecording(recordingLabel());   // 取り込みの成否が決まったら openStream が貼り直す
    timerEl.textContent = '0:00';
    pill.classList.toggle('meeting', mode === 'meeting');

    try {
      await openStream();
    } catch (e) {
      // 相手の声を先に開いていることがある。閉じないと画面キャプチャが残る。
      cleanup();
      window.koeOverlay.sendError('マイクにアクセスできません（OSのマイク許可を確認してください）');
      return;
    }
    // ここに来るまでに数秒かかることがある（相手の声の取り込み・デバイスの
    // オープン）。その間に「終了」「破棄」が押されていることがあるので、
    // 進む前にもう一度見る。見ないと、押したあともマイクと画面キャプチャを
    // 掴んだまま最初の区間が終わるまで（最大20秒）録り続ける。
    if (cancelled) { cleanup(); return; }
    if (stopping) {
      cleanup();
      // main は終了処理に入って最後の区間を待っている。空で閉じてやる。
      if (mode === 'meeting') window.koeOverlay.sendSegment(new Uint8Array(0), 0, true);
      else window.koeOverlay.sendError('録音を開始できませんでした');
      return;
    }
    muteSystemForBeep();
    beep(SND.start);
    startedAt = Date.now();
    // 一時停止していた時間は会議の長さに含めない
    timerId = setInterval(() => {
      const pause = pausedMs + (paused ? Date.now() - pausedAt : 0);
      timerEl.textContent = fmt(Date.now() - startedAt - pause);
    }, 250);

    if (mode === 'meeting') startMeetingSegment();
    else startDictation();
    starting = false;
    active = true;      // ここから先は active が二重起動を止める
  }

  // --- 音声入力（1本録り） ---
  function startDictation() {
    recorder = newRecorder();
    recorder.onstop = async () => {
      stopMeters();
      const durationMs = Date.now() - startedAt;
      if (cancelled) { cleanup(); return; }
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      try {
        const wav = await blobToWav16k(blob);
        window.koeOverlay.sendAudio(wav, 'audio/wav', durationMs);
      } catch (e) {
        window.koeOverlay.sendError('音声の変換に失敗しました');
      }
      releaseStream();
    };
    // 上限時間で打ち切るときも通常の停止と同じ扱いにする。
    // recorder を直接止めると表示が「聞き取り中…」のまま変換に入り、
    // 話し続けてよいのか分からない見た目になる。
    autoStopId = setTimeout(() => {
      if (recorder && recorder.state === 'recording') stop();
    }, DICTATION_MAX_MS);
    recorder.start(250);
  }

  // --- 議事録（セグメント録り） ---
  // 画面が隠れると setTimeout は間引かれ、75秒の区切りが数分遅れることが
  // ある（実機で1区間が9分になり、文字起こしが時間切れで失われた）。
  // そこで区切りは3重に見張る: 通常の setTimeout、音声パイプラインが刻む
  // ondataavailable、そして間引かれない main からの overlay:tick。
  function cutSegmentIfOverdue(rec) {
    if (paused) return;
    if (!(mode === 'meeting' && segDeadline && Date.now() >= segDeadline + 2000
        && rec && rec === recorder && rec.state === 'recording' && !stopping && !cancelled)) return;
    // 遅延中の setTimeout を必ず消してから切る。消さないと、そのタイマーが
    // ID を失ったまま生き残り、あとから発火して「次の」区間を途中で切る。
    if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }
    rec.stop();
  }

  function startMeetingSegment() {
    if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }   // 前区間の消し忘れ保険
    chunks = [];
    segStart = Date.now();
    const thisSegMs = firstSegDone ? segmentMs : FIRST_SEG_MS;
    firstSegDone = true;
    segDeadline = segStart + thisSegMs;
    recorder = newRecorder();
    recorder.onstop = async () => {
      const durationMs = Date.now() - segStart;
      if (cancelled) { cleanup(); return; }
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      let wav = null;
      try {
        wav = await blobToWav16k(blob);
      } catch (e) { wav = null; }
      // 変換の途中で「終了」「破棄」が押されていることがある。
      // 区切りの直前に決めた値のままだと、この区間を最後と扱えず次の録音が
      // 始まってしまい、マイクが開いたまま残る。変換後にもう一度見る。
      if (cancelled) { cleanup(); return; }
      const isFinal = stopping;
      if (wav) window.koeOverlay.sendSegment(wav, durationMs, isFinal);
      else if (isFinal) window.koeOverlay.sendSegment(new Uint8Array(0), durationMs, true);
      if (paused) return;      // 一時停止で締めた区間。再開まで次は始めない
      if (!isFinal) {
        startMeetingSegment(); // 次のセグメントへ
      } else {
        stopMeters();
        releaseStream();
      }
    };
    autoStopId = setTimeout(() => {
      if (recorder && recorder.state === 'recording') recorder.stop();
    }, thisSegMs);
    recorder.start(250);
  }

  // 一時停止。録音そのものを止め、それまでの区間はきちんと締めて送る。
  // 中途半端に持ったまま止めると、再開までの分が同じ区間に混ざり、
  // 一時停止した意味が無くなる。
  function pauseRec() {
    if (paused || mode !== 'meeting' || stopping || cancelled) return;
    paused = true;
    pausedAt = Date.now();
    pill.classList.add('paused');
    if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }
    segDeadline = 0;
    stopMeters();                 // 波形とマイクの見張りを止める
    if (recorder && recorder.state === 'recording') recorder.stop();  // 区間を締めて送る
    releaseStream();              // マイクを解放する。停止中に録っていないことを機器の表示でも示す
    setPhase('recording', recordingLabel());
    window.koeOverlay.reportPause(true);
  }

  async function resumeRec() {
    if (!paused || stopping || cancelled) return;
    pausedMs += Date.now() - pausedAt;
    paused = false;
    pill.classList.remove('paused');
    try {
      await openStream();         // マイクを開き直す
    } catch (e) {
      paused = true; pausedAt = Date.now(); pill.classList.add('paused');
      setPhase('recording', 'マイクを開けませんでした。もう一度お試しください');
      return;
    }
    if (stopping || cancelled) { cleanup(); return; }
    firstSegDone = true;          // 再開後は通常の区間長で刻む
    startMeetingSegment();
    setPhase('recording', recordingLabel());
    window.koeOverlay.reportPause(false);
  }

  function stop() {
    // 一時停止中は録音が止まっているので、そのまま締める
    if (paused) {
      paused = false;
      pausedMs += Date.now() - pausedAt;
      pill.classList.remove('paused');
      stopping = true;
      setPhase('processing', mode === 'meeting' ? '議事録を作成中…' : '文字起こし中…');
      beep(SND.stop);
      window.koeOverlay.sendSegment(new Uint8Array(0), 0, true);
      cleanup();
      return;
    }
    stopping = true;
    if (autoStopId) clearTimeout(autoStopId);
    setPhase('processing', mode === 'meeting' ? '議事録を作成中…' : '文字起こし中…');
    muteSystemForBeep();   // 終了のビープを最後の区間に録り込まない
    beep(SND.stop);
    if (recorder && recorder.state === 'recording') recorder.stop();
  }

  function cancel() {
    cancelled = true;
    if (autoStopId) clearTimeout(autoStopId);
    setPhase('error', 'キャンセルしました');
    beep(SND.cancel);
    if (recorder && recorder.state === 'recording') recorder.stop();
    else cleanup();
    setTimeout(() => pill.classList.remove('visible'), 400);
    setTimeout(() => window.koeOverlay.requestHide(), 650);
  }

  // 音が入っていないまま録り続けていないか見張る。
  // 表示を書き換えるだけで、録音そのものには手を触れない。
  // 相手の声も録っているときは、どちらかに音が入っていれば無音ではない。
  // 聞き役に回っている間じゅう警告を出すと、本当にマイクが死んだときに
  // 誰も見なくなる。一方、マイクだけが死んでいる状態は相手の声に隠れるので、
  // そちらは別に数える（自分の発言が会議まるごと欠ける）。
  function checkSilence(micLevel, sysLevel) {
    if (stopping || cancelled || paused || pill.dataset.phase !== 'recording') return;
    const now = Date.now();
    const level = Math.max(micLevel, sysLevel || 0);

    if (level > SILENT_LEVEL) silentSince = 0;
    else if (silentSince === 0) silentSince = now;

    if (micLevel > SILENT_LEVEL) micSilentSince = 0;
    else if (micSilentSince === 0) micSilentSince = now;

    // 両方無音の方を優先する。マイクだけの警告より事態が重い。
    let label = recordingLabel();
    if (silentSince && now - silentSince >= SILENT_WARN_MS) {
      label = '音が入っていません。マイクを確認してください';
    } else if (sysOn && micSilentSince && now - micSilentSince >= MIC_SILENT_WARN_MS) {
      label = 'マイクの音が入っていません';
    }
    if (label !== shownLabel) showRecording(label);
  }

  function stopMeters() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (timerId) clearInterval(timerId);
    timerId = null;
    if (autoStopId) clearTimeout(autoStopId);
    autoStopId = null;
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    analyser = null;
    sysAnalyser = null;
    mixDest = null;
    sysGain = null;
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  }
  function releaseStream() {
    // 実デバイスを掴んでいるのは micStream と sysStream。mediaStream は
    // 合成時は mixDest.stream（audioCtx.close で終わる）、非合成時は micStream と
    // 同一なので、3本まとめて止めても二重 stop になるだけで無害。
    // ここで micStream を落とし忘れると、録音が終わってもマイクが開いたままになり、
    // OS のマイク使用表示が点きっぱなしになる。
    for (const st of [micStream, sysStream, mediaStream]) {
      if (st) st.getTracks().forEach((t) => t.stop());
    }
    micStream = null;
    sysStream = null;
    mediaStream = null;
    sysOn = false;
    recorder = null;
    // 音声入力の正常終了は cleanup を通らず、ここだけを通る。
    // 倒し忘れると次の録音が永久に始まらない。
    starting = false;
    active = false;
  }
  function cleanup() {
    stopMeters();
    releaseStream();   // starting / active はここで倒れる
    chunks = [];
  }

  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (mode !== 'meeting') return;
    if (paused) resumeRec(); else pauseRec();
  });
  document.getElementById('stopBtn').addEventListener('click', () => window.koeOverlay.confirmStop());
  document.getElementById('ngBtn').addEventListener('click', () => window.koeOverlay.requestCancel());

  // main からは IPC と executeJavaScript の2経路で来る。両方ここへ合流させる。
  // getDisplayMedia は「ユーザー操作の直後」を求めることがあり、
  // IPC 経由だとその扱いにならない場合があるため。
  window.__koeStart = (p) => {
    // main は executeJavaScript と IPC の2経路で呼ぶ（前者が失敗したら後者）。
    // 両方届くと MediaRecorder が2つになり、chunks が混ざって全区間が壊れる。
    if (starting || active) return;
    mode = (p && p.mode) || 'dictation';
    segmentMs = ((p && p.segmentSec) || 75) * 1000;
    micId = (p && p.micId) || '';
    soundOn = !p || p.sound !== false;
    // 音声入力（1本録り）は常にマイクだけ。合成は議事録のときだけ。
    sysWanted = mode === 'meeting' && Boolean(p && p.systemAudio);
    sysOn = false;
    pill.classList.add('visible');
    start();
  };
  window.koeOverlay.onStart((p) => window.__koeStart(p));
  window.koeOverlay.onTick(() => cutSegmentIfOverdue(recorder));
  window.koeOverlay.onStop(() => stop());
  window.koeOverlay.onCancel(() => cancel());
  window.koeOverlay.onPhase(({ phase, message, procSec }) => {
    setPhase(phase, message);
    if (phase === 'done') {
      timerEl.textContent = procSec ? `${procSec}s` : '';
      beep(SND.done);
      setTimeout(() => pill.classList.remove('visible'), 1600);
    } else if (phase === 'error') {
      beep(SND.error);
      setTimeout(() => pill.classList.remove('visible'), 2800);
    }
  });
})();
</script>
</body>
</html>
