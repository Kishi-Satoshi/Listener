# リリースを公開する。
#
# 添付するのは src/ と package.json だけを固めた軽量zip（make-release.ps1 と同じ構成）。
# インストーラー丸ごと（80MB超）だと、大容量ダウンロードが切れる回線で
# 更新のたびに失敗しかねないため、更新の配布はこのzipで行う。
# リリース本文はアプリの [設定] -> [アップデート] にそのまま表示される。
#
# 起動のしかたは3通り。どれも結果は同じ。
#
#  1. タグを push する（通常はこれ）
#       git tag -a v0.8.1 -m "変更点をここに書く"
#       git push origin v0.8.1
#
#  2. Actions 画面の "Run workflow"（ブラウザだけで完結する）
#
#  3. release/v0.8.1 という名前のブランチを push する
#       タグの push を通さないプロキシ環境のための逃げ道。
#       公開できたらこのブランチは自動で消す。
#
# 公開の順序（#33）:
#   release ジョブは zip と ps1 を添付した「draft」を作るだけで、公開しない。
#   installer ジョブ（Windows）が exe を添付できてから draft を解いて latest にする。
#   先に latest にすると、installer が失敗したとき exe の無いリリースが latest の
#   まま残り、配布先は setup.exe を落とせないのに誰も気付けない。
#   draft の間は releases/latest に出ないので、アプリの更新確認には前の版が
#   出続ける（新しい版が見えない）。installer が失敗したら draft のまま残るので、
#   Actions の要約（赤い見出し）を見て再実行するか、Releases で draft を確かめること。
name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '作成するタグ（例: v0.8.0）。省略すると package.json の version から決める'
        required: false
        type: string
      notes:
        description: 'リリース本文。省略するとタグの注釈、それも無ければ既定文を使う'
        required: false
        type: string

permissions:
  contents: write # リリースとタグの作成に必要

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft の作成と添付
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      cleanup: ${{ steps.ver.outputs.cleanup }} # 公開後に消す一時ブランチ（無ければ空）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # タグの注釈を読むため、履歴ごと取得する

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 入力は env 経由で渡す（run の中へ直接展開しない）
      - name: バージョンとタグを決める
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          CLEANUP=''
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v${VER}}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "${GITHUB_REF#refs/heads/release/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF_NAME#release/}"
            CLEANUP="$GITHUB_REF_NAME"   # 公開後に消す一時ブランチ
          else
            echo "::error::想定外の ref です: $GITHUB_REF"
            exit 1
          fi
          # 版ずれのまま公開すると、配布先が更新を受け取れない／取り違える
          if [ "${TAG#v}" != "$VER" ]; then
            echo "::error::タグ ($TAG) と package.json ($VER) のバージョンが一致しません"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CLEANUP=$CLEANUP" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "cleanup=$CLEANUP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG / package.json=$VER"

      # 追加のnpm依存は無いので install は不要（テストは Node 同梱のランナー）
      - name: テスト
        run: npm test

      # 前のタグからの差分で「新たに壊れたもの」を見る。
      # pre-commit を --no-verify で越えても、ここで必ず捕まる。
      - name: 変更危険度ゲート（前のタグ→HEAD）
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "基準: $PREV"
          node tools/risk.js --base "$PREV" --head HEAD

      # 変更内容から、実機で見るべき項目だけを出す
      - name: 実機確認チェックリスト
        run: |
          node tools/risk.js --base-tag --checklist RELEASE-CHECK.md || true
          if [ -f RELEASE-CHECK.md ]; then cat RELEASE-CHECK.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 配布zipを作る
        run: |
          rm -rf release
          mkdir -p release/_stage
          cp -a src release/_stage/src
          cp package.json release/_stage/package.json
          (cd release/_stage && zip -q -r -X "../listener-src-${VER}.zip" src package.json)
          rm -rf release/_stage
          unzip -l "release/listener-src-${VER}.zip"

      # 本文の決め方: 入力 -> CHANGELOG.md の該当節 -> タグの注釈 -> 既定文
      - name: リリース本文を組み立てる
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          blank() { [ -z "$(printf '%s' "$1" | tr -d '[:space:]')" ]; }
          NOTES="$INPUT_NOTES"
          if blank "$NOTES" && [ -f CHANGELOG.md ]; then
            NOTES="$(awk -v tag="$TAG" '
              $0 ~ "^## +" tag "([ \t]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)"
          fi
          if blank "$NOTES"; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          fi
          if blank "$NOTES"; then
            NOTES="Listener ${TAG}"
          fi
          # 前後の空行を落とす
          printf '%s\n' "$NOTES" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > "$RUNNER_TEMP/notes.md"
          echo '--- リリース本文 ---'
          cat "$RUNNER_TEMP/notes.md"

      # ここでは公開しない（draft のまま）。公開は installer ジョブが exe を
      # 添付できてから行う（draft を解いて latest にする）。--latest もここでは付けない。
      # 作り直しでも落ちないようにする（本文の直しや添付のやり直しができる）。
      - name: リリースを draft で作る（zip と ps1 を添付）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="release/listener-src-${VER}.zip"
          # get-installer.ps1 も添付する。インストーラー本体は大きく、
          # 回線によっては途中で切れるので、続きから取り直せる手段を
          # リリースページ上に置いておく。
          # setup-*.ps1 も添付する。インストーラーだけでは文字起こしも要約も
          # 動かない（エンジンが要る）。渡した相手がリポジトリを触らずに
          # 揃えられるよう、リリースページから直接落とせるようにしておく。
          SETUP="get-installer.ps1 setup-local-engine.ps1 setup-summarizer.ps1"
          # gh はタグ名で draft も見つける（公開済みでなくても view/edit/upload が効く）
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "既存のリリースを更新します: $TAG（installer が exe を確かめるまで draft に戻す）"
            # zip を差し替えた状態が exe の確認前に見えないよう、公開済みでも draft に戻す。
            # installer ジョブの最後で必ず公開（draft 解除・latest）に戻す。
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$ZIP" $SETUP
          else
            # タグが無ければ、公開（draft 解除）のときに gh/GitHub が --target のコミットに作る。
            # 一時ブランチはタグができるまで消せないので、削除は公開後（installer ジョブ）で行う。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" --draft "$ZIP" $SETUP
          fi
          echo "draft を作りました: $TAG（exe を添付できたら installer ジョブが公開します）"

  # インストーラーは Windows ランナーで作る。
  # electron-builder が取ってくる winCodeSign には macOS 用のシンボリックリンクが
  # 入っており、Windows で展開するには特権が要る。手元の環境では
  # 「クライアントは要求された特権を保有していません」で止まるため、
  # ここで作って Release に添付する。配布先はこれを落として入れるだけでよい。
  #
  # 更新は軽量zip（数百KB）で配るので、この exe を落とすのは初回だけ。
  #
  # このジョブが release を公開する（draft を解いて latest にする）。
  # exe を添付できるまで公開しないので、失敗すれば draft のまま残る。
  installer:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write # exe の添付・draft の解除・一時ブランチの削除に必要
    steps:
      # 履歴は要らない（ビルドと、最後の一時ブランチ削除だけ）。既定の浅い取得でよい。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 同じ版で二度ビルドすると、埋め込まれる時刻などの違いでハッシュが変わる。
      # 公開済みの exe を差し替えると、先に落とした人と中身が食い違うので、
      # 既に添付されていれば何もしない（作り直したい場合は版を上げる）。
      - name: 公開済みか確認する
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' | grep -q -- '-setup\.exe$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG には既にインストーラーが添付されています。作り直しません。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存を入れる（electron / electron-builder）
        if: steps.exists.outputs.skip == 'false'
        run: npm install --no-audit --no-fund

      # --publish never を渡す。CI では electron-builder が自分で
      # GitHub へ publish しようとして GH_TOKEN を要求し、失敗する。
      # 添付は下のステップで自分で行う（リリースの作り方を握っておきたい）。
      - name: インストーラーを作る
        if: steps.exists.outputs.skip == 'false'
        run: npm run dist:installer -- --publish never

      - name: Release に添付する
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          ls -l dist/*.exe
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*-setup.exe

      # exe が揃ったので公開する。「既に添付されている」経路（作り直さない）でも
      # release ジョブが draft に戻しているので、ここで必ず解く。
      # ここで初めて releases/latest に出る。アプリの更新確認はここから新しい版を見る。
      - name: 公開する（draft を解いて latest にする）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          # 念のため exe の添付をもう一度見る（grep -q は pipefail と組むと早閉じで誤るので読み切る）
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -- '-setup\.exe$' >/dev/null \
            || { echo "::error::$TAG に setup.exe が添付されていません。公開しません（draft のまま）"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "公開しました: $TAG" >> "$GITHUB_STEP_SUMMARY"

      # ここまでのどこかで失敗したら、release は draft のまま残っている。
      # draft は releases/latest に出ないので、配布先には前の版が見え続ける。
      # 見落とすと「更新が来ない」だけの静かな故障になるので、要約に赤く出す。
      - name: 失敗を要約に出す（draft のまま）
        if: failure()
        env:
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          echo "::error::$TAG は公開されていません（draft のまま）。installer ジョブを再実行するか、Releases の draft を確かめてください"
          {
            echo "## ❌ 公開されていません（draft のまま）"
            echo ""
            echo "- リリース \`$TAG\` は draft のまま残っています。\`releases/latest\` には出ないので、配布先には前の版が見え続けます。"
            echo "- このワークフローを再実行するか、Releases ページで draft を確かめてください。"
            echo "- 一時ブランチ \`release/v*\` を使った場合、そのブランチは消していません。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 一時ブランチ release/v* は「公開できた後」に消す。
      # draft の間はタグが無いので、先に消すとコミットが宙に浮く。
      # 削除にコミット履歴は要らない（checkout は浅いまま。資格情報だけ使う）。
      - name: 一時ブランチを片付ける
        if: success() && needs.release.outputs.cleanup != ''
        env:
          CLEANUP: ${{ needs.release.outputs.cleanup }}
        shell: bash
        run: git push origin --delete "$CLEANUP"
