# リリースを公開する。
#
# 添付するのは src/ と package.json だけを固めた軽量zip（make-release.ps1 と同じ構成）。
# インストーラー丸ごと（80MB超）だと、大容量ダウンロードが切れる回線で
# 更新のたびに失敗しかねないため、更新の配布はこのzipで行う。
# リリース本文はアプリの [設定] -> [アップデート] にそのまま表示される。
#
# 起動のしかたは3通り。どれも結果は同じ。
#
#  1. タグを push する（通常はこれ）
#       git tag -a v0.8.1 -m "変更点をここに書く"
#       git push origin v0.8.1
#
#  2. Actions 画面の "Run workflow"（ブラウザだけで完結する）
#
#  3. release/v0.8.1 という名前のブランチを push する
#       タグの push を通さないプロキシ環境のための逃げ道。
#       公開できたらこのブランチは自動で消す。
name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '作成するタグ（例: v0.8.0）。省略すると package.json の version から決める'
        required: false
        type: string
      notes:
        description: 'リリース本文。省略するとタグの注釈、それも無ければ既定文を使う'
        required: false
        type: string

permissions:
  contents: write # リリースとタグの作成に必要

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # タグの注釈を読むため、履歴ごと取得する

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 入力は env 経由で渡す（run の中へ直接展開しない）
      - name: バージョンとタグを決める
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          CLEANUP=''
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v${VER}}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "${GITHUB_REF#refs/heads/release/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF_NAME#release/}"
            CLEANUP="$GITHUB_REF_NAME"   # 公開後に消す一時ブランチ
          else
            echo "::error::想定外の ref です: $GITHUB_REF"
            exit 1
          fi
          # 版ずれのまま公開すると、配布先が更新を受け取れない／取り違える
          if [ "${TAG#v}" != "$VER" ]; then
            echo "::error::タグ ($TAG) と package.json ($VER) のバージョンが一致しません"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CLEANUP=$CLEANUP" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG / package.json=$VER"

      # 追加のnpm依存は無いので install は不要（テストは Node 同梱のランナー）
      - name: テスト
        run: npm test

      - name: 配布zipを作る
        run: |
          rm -rf release
          mkdir -p release/_stage
          cp -a src release/_stage/src
          cp package.json release/_stage/package.json
          (cd release/_stage && zip -q -r -X "../listener-src-${VER}.zip" src package.json)
          rm -rf release/_stage
          unzip -l "release/listener-src-${VER}.zip"

      # 本文の決め方: 入力 -> CHANGELOG.md の該当節 -> タグの注釈 -> 既定文
      - name: リリース本文を組み立てる
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          blank() { [ -z "$(printf '%s' "$1" | tr -d '[:space:]')" ]; }
          NOTES="$INPUT_NOTES"
          if blank "$NOTES" && [ -f CHANGELOG.md ]; then
            NOTES="$(awk -v tag="$TAG" '
              $0 ~ "^## +" tag "([ \t]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)"
          fi
          if blank "$NOTES"; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          fi
          if blank "$NOTES"; then
            NOTES="Listener ${TAG}"
          fi
          # 前後の空行を落とす
          printf '%s\n' "$NOTES" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > "$RUNNER_TEMP/notes.md"
          echo '--- リリース本文 ---'
          cat "$RUNNER_TEMP/notes.md"

      # 作り直しでも落ちないようにする（本文の直しや添付のやり直しができる）
      - name: リリースを公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="release/listener-src-${VER}.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "既存のリリースを更新します: $TAG"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$ZIP"
          else
            # タグが無ければ gh がこのコミットに作る。
            # --latest を外すとアプリ側の releases/latest から外れるので必ず付ける。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest "$ZIP"
          fi

      - name: 一時ブランチを片付ける
        if: success() && env.CLEANUP != ''
        run: git push origin --delete "$CLEANUP"

  # インストーラーは Windows ランナーで作る。
  # electron-builder が取ってくる winCodeSign には macOS 用のシンボリックリンクが
  # 入っており、Windows で展開するには特権が要る。手元の環境では
  # 「クライアントは要求された特権を保有していません」で止まるため、
  # ここで作って Release に添付する。配布先はこれを落として入れるだけでよい。
  #
  # 更新は軽量zip（数百KB）で配るので、この exe を落とすのは初回だけ。
  installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存を入れる（electron / electron-builder）
        run: npm install --no-audit --no-fund

      # --publish never を渡す。CI では electron-builder が自分で
      # GitHub へ publish しようとして GH_TOKEN を要求し、失敗する。
      # 添付は下のステップで自分で行う（リリースの作り方を握っておきたい）。
      - name: インストーラーを作る
        run: npm run dist:installer -- --publish never

      - name: Release に添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          ls -l dist/*.exe
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*-setup.exe
